<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b16;color:#eaf0ff}
/* u = 1% of the short side, times the canvas's type multiplier k.
   Every measurement in the template is a multiple of u, so one template
   works on a square, a story and a wide banner without re-tuning. */
.card{--u:calc(min(100vw, 100vh) / 100 * 1);
 color:#eaf0ff;
 position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;
 justify-content:center;gap:calc(var(--u) * 5);padding:calc(var(--u) * 9) calc(var(--u) * 8) calc(var(--u) * 9) calc(var(--u) * 8);
 overflow:hidden;
 background:radial-gradient(120% 70% at 78% 6%,rgba(79,140,255,.30),transparent 60%),
            radial-gradient(90% 60% at 10% 100%,rgba(139,92,246,.20),transparent 62%),#070a1a;
 font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
/* vignette: pulls the eye to the centre and makes the type sit forward */
.card:after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(125% 92% at 50% 44%,transparent 44%,rgba(0,0,0,.58))}
.badge{align-self:flex-start;background:linear-gradient(96deg, #4f8cff, #8b5cff);color:#fff;
 font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--u) * 1.95);
 padding:calc(var(--u) * 1.5) calc(var(--u) * 2.7);border-radius:999px;
 box-shadow:0 18px 44px rgba(79,140,255,.35);z-index:2}
.type{position:relative;z-index:2}
.a,.b{font-size:calc(var(--u) * 8.6);line-height:1.07;font-weight:800;max-width:100%;overflow-wrap:break-word;word-break:normal;hyphens:none;
 letter-spacing:-0.03em;margin:0;text-wrap:balance}
.a{color:#eaf0ff}
.b{background:linear-gradient(96deg, #7db4ff, #4f8cff 42%, #8b5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rules{margin-top:calc(var(--u) * 1.5);display:flex;gap:calc(var(--u) * 1.2)}
.rules i{height:calc(var(--u) * .55);flex:1;background:rgba(255,255,255,.14);border-radius:999px;
 transform-origin:left center}
.foot{margin-top:calc(var(--u) * 3.5);flex-shrink:0;display:flex;align-items:center;gap:calc(var(--u) * 1.8);
 color:#94a3c4;font-size:calc(var(--u) * 2.35);font-weight:600;z-index:2}
.foot b{color:#fff;font-weight:800}
.foot .pitch{line-height:1.35;flex:1}
.foot .cta{flex:0 0 auto;background:linear-gradient(96deg, #4f8cff, #8b5cff);color:#fff;font-weight:800;padding:calc(var(--u) * 1.5) calc(var(--u) * 2.6);border-radius:999px;box-shadow:0 14px 34px rgba(79,140,255,.35);white-space:nowrap}
.foot img{height:calc(var(--u) * 3.6);display:block}



</style></head><body><div class="card">
  <div class="badge">Free for teachers</div>
  <div class="type">
    <p class="a">The 2-minute</p>
    <p class="b">understanding check.</p>
    <div class="rules"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="foot"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNTYgMjU2IiB3aWR0aD0iMjU2IiBoZWlnaHQ9IjI1NiI+CiAgPHBhdGggZD0iTTUxLjUgMTM1LjMgTDk4LjkgMTg0LjMgTDIwNC42IDcxLjgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZmZmZiIgc3Ryb2tlLXdpZHRoPSIzOSIKICAgICBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9zdmc+" alt=""><span class="pitch"><b>Get It?</b> &middot; the free 2-minute understanding check for teachers<br>dotheygetit.app</span><span class="cta">Try it free &rarr;</span></div>
</div>

</body></html>

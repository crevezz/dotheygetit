<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Understanding Check</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header>
  <h1>Understanding <span>Check</span></h1>
  <nav>
    <button id="tab-teacher" class="tab active" data-tip="For teachers: make checks and see results.">Teacher</button>
    <button id="tab-student" class="tab" data-tip="For students: enter your class code and answer the questions.">Student</button>
  </nav>
</header>

<main>

  <!-- ============================ TEACHER ============================ -->
  <section id="view-teacher">

    <div class="card" id="authCard">
      <h3>Teacher sign in</h3>
      <div class="row"><input id="authEmail" placeholder="Email" type="email" autocomplete="email"/></div>
      <div class="row"><input id="authPass" placeholder="Password" type="password" autocomplete="current-password"/></div>
      <div class="row">
        <button id="btnLogin" class="primary" data-tip="Log in to your existing account.">Log in</button>
        <button id="btnSignup" data-tip="First time here? Create an account with your email.">Create account</button>
      </div>
      <p class="msg" id="authMsg"></p>
    </div>

    <div class="hidden" id="dash">

      <div class="card">
        <div class="srow">
          <h3 style="margin:0;">Your classes</h3>
          <button id="btnLogout" class="small-btn" data-tip="Sign out of your account.">Log out</button>
        </div>
        <div id="classList"></div>
        <div class="row">
          <input id="newClassName" placeholder="New class name, e.g. Year 8 Maths"/>
          <button id="btnAddClass" class="primary" data-tip="Creates a class with its own permanent join code. Reuse it all year.">Add class</button>
        </div>
        <p class="msg" id="classMsg"></p>
      </div>

      <div class="card hidden" id="classPanel">
        <h3 id="classTitle"></h3>

        <p class="muted">Students join with this code:</p>
        <div class="join-code" data-tip="Students type this code on the Student tab. It stays the same all year — just make a new check each lesson."><span id="classCode"></span></div>
        <p class="muted" style="text-align:center; margin-top:0;">Anyone goes to the Student tab and types this.</p>

        <hr/>
        <h3>New check</h3>
        <span class="label">Topic</span>
        <div class="row"><input id="topic" placeholder="e.g. comparing fractions" data-tip="Type what you taught. Keep it short and simple — the AI turns it into questions."/></div>
        <div class="row">
          <button id="btnGenerate" class="primary" data-tip="The AI writes a few questions. You can edit or delete any of them.">1. Generate questions</button>
          <button id="btnCreateCheck" class="hidden" data-tip="Makes this check live. Students who join now will get these exact questions.">2. Create check</button>
        </div>
        <div id="qwrap" class="hidden">
          <div id="qlist"></div>
          <button id="btnAddQ" class="small-btn" data-tip="Add a question of your own.">+ Add question</button>
        </div>
        <p class="msg" id="checkMsg"></p>

        <hr/>
        <h3>Past checks</h3>
        <div id="checkList"><p class="muted">None yet.</p></div>
        <div id="results"></div>
      </div>

    </div>
  </section>

  <!-- ============================ STUDENT ============================ -->
  <section id="view-student" class="hidden">

    <div class="card" id="joinCard">
      <h3>Join a check</h3>
      <div class="row"><input id="joinCode" placeholder="Class code" autocapitalize="off" autocomplete="off" data-tip="Ask your teacher for the class code."/></div>
      <div class="row"><input id="studentName" placeholder="Your name" autocomplete="off" data-tip="Type your name so your teacher knows it's you."/></div>
      <button id="btnJoin" class="primary" data-tip="Start the check. There are no right or wrong answers to type — just explain what you know.">Start</button>
      <p class="msg" id="joinMsg"></p>
    </div>

    <div class="card hidden" id="checkCard">
      <h3 id="checkTopic"></h3>
      <div id="chat"></div>
      <div class="row">
        <input id="answer" placeholder="Type your answer..." autocomplete="off"/>
        <button id="btnSend" class="primary" data-tip="Send your answer (or press Enter).">Send</button>
      </div>
    </div>

  </section>

</main>

<script src="app.js"></script>
</body>
</html>

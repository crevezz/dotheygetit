<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Get It? — Do they get it?</title>
<meta name="description" content="Find out who really understood your lesson — while you can still do something about it."/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header>
  <div class="wrap hrow">
    <div class="brand">
      <span class="mark">✓</span>
      <span>Get It?<small>Do they get it?</small></span>
    </div>
    <nav>
      <button id="tab-teacher" class="tab active" data-tip="For teachers: make a check and see who got it.">Teacher</button>
      <button id="tab-student" class="tab" data-tip="For students: enter your class code and answer the questions.">Student</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ============================ TEACHER ============================ -->
  <section id="view-teacher">

    <div class="card narrow" id="authCard">
      <h2>Teacher sign in</h2>
      <p class="muted">Make a check, get a code, hand it to your class.</p>
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="you@school.sch.uk" autocomplete="email"/>
      <label>Password</label>
      <input id="authPass" type="password" placeholder="At least 6 characters" autocomplete="current-password"/>
      <div class="btnrow">
        <button id="btnLogin" class="primary" data-tip="Log in to your existing account.">Log in</button>
        <button id="btnSignup" class="ghost" data-tip="First time here? This makes your account.">Create account</button>
      </div>
      <p class="msg" id="authMsg"></p>
    </div>

    <div class="hidden" id="dash">

      <div class="card">
        <div class="srow">
          <h3>Your classes</h3>
          <button id="btnLogout" class="small-btn" data-tip="Sign out of your account.">Log out</button>
        </div>
        <div id="classList"></div>
        <div class="row">
          <input id="newClassName" placeholder="New class name, e.g. Year 8 Maths"/>
          <button id="btnAddClass" class="primary" data-tip="Makes a class with its own permanent join code. Reuse it all year.">Add class</button>
        </div>
        <p class="msg" id="classMsg"></p>
      </div>

      <div class="card hidden" id="classPanel">
        <div class="srow">
          <h3 id="classTitle"></h3>
          <button class="small-btn" id="btnCloseClass" data-tip="Hide this class.">Close</button>
        </div>

        <div class="codebox">
          <div class="codeleft">
            <span class="label">Students join with</span>
            <div class="join-code" data-tip="Students type this code on the Student tab. It stays the same all year."><span id="classCode"></span></div>
          </div>
          <div class="coderight">
            <button class="small-btn" id="btnCopyCode" data-tip="Copy the code.">Copy code</button>
            <button class="small-btn" id="btnCopyLink" data-tip="Copy a link that fills the code in for them.">Copy link</button>
          </div>
        </div>

        <hr/>

        <h3>New check</h3>
        <span class="label">What did you teach?</span>
        <input id="topic" placeholder="e.g. comparing fractions" data-tip="Type what you taught. Keep it short — the AI turns it into questions."/>
        <div class="btnrow">
          <button id="btnGenerate" class="primary" data-tip="The AI writes a few questions. Edit or delete any you don't like.">1. Generate questions</button>
          <button id="btnCreateCheck" class="hidden" data-tip="Makes this check live. Students who join now get these exact questions.">2. Create check</button>
        </div>
        <div id="qwrap" class="hidden">
          <div id="qlist"></div>
          <button id="btnAddQ" class="small-btn" data-tip="Add a question of your own.">+ Add question</button>
        </div>
        <p class="msg" id="checkMsg"></p>

        <div class="livebar hidden" id="liveBar">
          <span class="dot"></span>
          <span id="liveText">Check is live</span>
          <button class="small-btn" id="btnOpenStudent" data-tip="Open the student view in a new tab.">Open student view</button>
        </div>

        <hr/>
        <h3>Past checks</h3>
        <div id="checkList"><p class="muted">None yet.</p></div>
        <div id="results"></div>
      </div>

    </div>
  </section>

  <!-- ============================ STUDENT ============================ -->
  <section id="view-student" class="hidden">

    <div class="card narrow" id="joinCard">
      <h2>Join a check</h2>
      <p class="muted">Your teacher will give you a code. No account, no login.</p>
      <label>Class code</label>
      <input id="joinCode" placeholder="e.g. k7pm2q" autocapitalize="off" autocomplete="off" data-tip="Ask your teacher for this."/>
      <label>Your name</label>
      <input id="studentName" placeholder="e.g. Amira K" autocomplete="off" data-tip="So your teacher knows it's you."/>
      <button id="btnJoin" class="primary wide" data-tip="No right or wrong answers — just explain it in your own words.">Start</button>
      <p class="msg" id="joinMsg"></p>
    </div>

    <div class="card hidden" id="checkCard">
      <div class="srow">
        <h3 id="checkTopic"></h3>
        <span class="progress" id="progress"></span>
      </div>
      <div id="chat"></div>
      <div class="row stick">
        <input id="answer" placeholder="Type your answer..." autocomplete="off" autofocus/>
        <button id="btnSend" class="primary" data-tip="Send (or press Enter).">Send</button>
      </div>
      <p class="msg" id="chatMsg"></p>
    </div>

  </section>

</main>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
